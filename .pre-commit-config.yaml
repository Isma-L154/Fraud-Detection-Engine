# Runs the same checks CI will run (#8), but before a commit exists rather than
# after a pull request is rejected.
#
# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^fraud-detection-engine/(app|notebooks)/
      - id: ruff-format
        name: ruff (format)
        files: ^fraud-detection-engine/(app|notebooks)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        # The model artifact is 3.5 MB and the dataset is 150 MB. Neither belongs
        # in git; this is the backstop for an accidental `git add .` (see #4).
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (app/)
        files: ^fraud-detection-engine/app/
        args: [--config-file=fraud-detection-engine/pyproject.toml]
        additional_dependencies: [pydantic==2.9.2, fastapi==0.115.3]
