# Runs the same checks CI will run (#8), but before a commit exists rather than
# after a pull request is rejected.
#
# Install once per clone:  pre-commit install
# Run over everything:     pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix]
        files: ^fraud-detection-engine/(app|notebooks|tests)/
      - id: ruff-format
        name: ruff (format)
        files: ^fraud-detection-engine/(app|notebooks|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Two trailing spaces are a hard line break in Markdown, not stray
        # whitespace. Stripping them silently changes how the document renders.
        exclude: \.md$
      - id: check-yaml
      - id: check-added-large-files
        # The model artifact is 3.5 MB and the dataset is 150 MB. Neither belongs
        # in git; this is the backstop for an accidental `git add .` (see #4).
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-merge-conflict

  # mypy runs as a local hook, against the project's own virtualenv, rather than
  # the mirrors-mypy repo. That hook builds an isolated environment which would
  # need every runtime dependency duplicated into additional_dependencies — and
  # when they drift, it reports errors that do not reproduce locally (a missing
  # pandas-stubs, an "unused type: ignore" for a library it cannot see).
  - repo: local
    hooks:
      - id: mypy
        name: mypy (app/)
        # Resolved from PATH, so the project virtualenv must be active. That is
        # already required to run the app or the tests.
        # The path is explicit because pre-commit runs from the repository root
        # while pyproject.toml's `files = ["app"]` is relative to the project dir.
        # An explicit target overrides that setting.
        entry: mypy --config-file=fraud-detection-engine/pyproject.toml fraud-detection-engine/app
        language: system
        pass_filenames: false
        files: ^fraud-detection-engine/app/
