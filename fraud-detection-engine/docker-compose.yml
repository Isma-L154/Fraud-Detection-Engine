# Local development and testing setup.
# Production on EC2 uses docker run directly

services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"      
    environment:
      - ENV=development
      - LOG_LEVEL=INFO

    volumes:
      - ./models:/app/models:ro    # ro = read-only inside the container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", 
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3