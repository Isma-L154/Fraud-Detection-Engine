# Local development and testing setup.
# Production on EC2 uses docker run directly

services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      # Required: the app refuses to start without an explicit origin allowlist.
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]

    volumes:
      - ./models:/app/models:ro    # ro = read-only inside the container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
